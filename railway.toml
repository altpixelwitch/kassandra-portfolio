[build]
builder = "RAILPACK"
buildCommand = "DATABASE_URL=\"$DATABASE_PUBLIC_URL\" pnpm payload migrate && DATABASE_URL=\"$DATABASE_PUBLIC_URL\" pnpm build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
